name: Update Event Data

on:
  schedule:
    - cron: '0 18,6 * * *'
  workflow_dispatch:
    inputs:
      force_full_scrape:
        description: '强制完整抓取'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: event-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Playwright
        run: |
          npx playwright install chromium
          npx playwright install-deps chromium

      - name: Record previous event count
        run: |
          previous_count=$(jq length src/data/events/processed-events.json)
          echo "PREVIOUS_EVENT_COUNT=$previous_count" >> "$GITHUB_ENV"
          echo "📊 更新前活动数: $previous_count"
          if [ "$previous_count" -eq 0 ]; then
            echo "❌ 仓库中的活动数据为空，请先恢复数据"
            exit 1
          fi


      - name: Scrape event data
        run: |
          echo "🕷️ 开始抓取最新活动数据..."
          if [ "${{ github.event.inputs.force_full_scrape }}" = "true" ]; then
            npm run scrape:events:force
          else
            npm run scrape:events
          fi

          raw_count=$(jq length data/events/events.json)
          echo "📊 抓取合并后的原始活动数: $raw_count"
          if [ "$raw_count" -eq 0 ]; then
            echo "❌ 抓取结果为空，终止更新并保留旧数据"
            exit 1
          fi
        env:
          CI: true
        timeout-minutes: 15

      - name: Process existing event data
        run: node scripts/process-events.js --skip-scrape
        env:
          NODE_ENV: production
          CI: true
        timeout-minutes: 10

      - name: Validate data
        run: |
          jq empty data/events/events.json
          jq empty src/data/events/processed-events.json
          jq empty src/data/events/city-mappings.json
          jq empty src/data/events/event-stats.json

          raw_count=$(jq length data/events/events.json)
          processed_count=$(jq length src/data/events/processed-events.json)
          minimum_count=$((PREVIOUS_EVENT_COUNT / 2))
          echo "📊 原始活动: $raw_count，处理后活动: $processed_count，安全下限: $minimum_count"

          if [ "$raw_count" -eq 0 ] || [ "$processed_count" -eq 0 ]; then
            echo "❌ 活动数据为空，拒绝提交"
            exit 1
          fi
          if [ "$processed_count" -lt "$minimum_count" ]; then
            echo "❌ 活动数量异常下降超过 50%，拒绝提交"
            exit 1
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          git add data/events/events.json \
            src/data/events/processed-events.json \
            src/data/events/city-mappings.json \
            src/data/events/event-stats.json

          if git diff --cached --quiet; then
            echo "📝 没有数据更新"
          else
            git commit -m "🤖 自动更新事件数据 $(date -u +"%Y-%m-%d %H:%M UTC")"
            git pull --rebase origin main
            git push origin main
            echo "✅ 数据更新已提交"
          fi
