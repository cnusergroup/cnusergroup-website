name: Build and Deploy to GitHub Pages

on:
  # 在推送到 main 分支时触发
  push:
    branches: [ main ]

  # 允许手动触发工作流
  workflow_dispatch:
    inputs:
      skip_cache:
        description: '跳过缓存，重新安装依赖'
        required: false
        default: false
        type: boolean

  # 数据更新工作流使用 GITHUB_TOKEN 推送时不会触发 push 工作流，显式监听其完成事件。
  # 抓取成功后自动部署，无需额外的定时部署。
  workflow_run:
    workflows: ["Update Event Data"]
    types: [completed]

# 设置 GITHUB_TOKEN 的权限
permissions:
  contents: write  # 需要写权限来提交抓取的数据
  pages: write
  id-token: write
  actions: read

# 只允许一个并发部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-and-build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: ${{ github.event.inputs.skip_cache != 'true' && 'npm' || '' }}
          
      - name: Install dependencies
        run: |
          if [ "${{ github.event.inputs.skip_cache }}" = "true" ]; then
            npm install
          else
            npm ci
          fi

      - name: Validate committed event data
        run: |
          echo "🔍 验证待部署的活动数据..."
          jq empty data/events/events.json
          jq empty src/data/events/processed-events.json
          raw_count=$(jq length data/events/events.json)
          processed_count=$(jq length src/data/events/processed-events.json)
          echo "📊 原始活动: $raw_count，处理后活动: $processed_count"
          if [ "$raw_count" -eq 0 ] || [ "$processed_count" -eq 0 ]; then
            echo "❌ 活动数据为空，终止部署以保留当前线上版本"
            exit 1
          fi
        
      # 原先这里有一个 "Run deployment preparation" 步骤（deploy-ready.js），
      # 它会完整跑一次 npm run build，但紧接着的 astro build 会清空 dist 重建，
      # 产物全部被丢弃。已移除，构建后优化改由 build:ci 内部调用 scripts/build.js。

      - name: Build with Astro
        run: |
          echo "🔨 构建 Astro 项目..."
          npm run build:ci
        env:
          NODE_ENV: production
          CI: true
          
      - name: Verify build output
        run: |
          echo "🔍 验证构建输出..."
          
          if [ ! -d "dist" ]; then
            echo "❌ 构建目录不存在"
            exit 1
          fi
          
          if [ ! -f "dist/index.html" ]; then
            echo "❌ 主页文件不存在"
            exit 1
          fi
          
          # 检查文件大小
          index_size=$(stat -c%s "dist/index.html")
          echo "📊 index.html 大小: $((index_size / 1024)) KB"
          
          if [ $index_size -lt 1000 ]; then
            echo "⚠️ 主页文件过小，可能构建有问题"
          fi
          
          # 检查关键页面
          key_pages=("cities/index.html" "about/index.html" "en/index.html")
          for page in "${key_pages[@]}"; do
            if [ -f "dist/$page" ]; then
              echo "✅ $page 存在"
            else
              echo "⚠️ $page 不存在"
            fi
          done
          
          echo "✅ 构建验证完成"
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: scrape-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
      - name: Verify deployment
        run: |
          echo "🌐 部署完成！"
          echo "📍 网站地址: ${{ steps.deployment.outputs.page_url }}"
          
          # 等待几秒让部署生效
          sleep 10
          
          # 验证网站是否可访问
          if curl -f -s "${{ steps.deployment.outputs.page_url }}" > /dev/null; then
            echo "✅ 网站访问正常"
          else
            echo "⚠️ 网站可能还在部署中，请稍后检查"
          fi